name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "6"
            suffix: ""
          - goos: linux
            goarch: "386"
            suffix: ""
          - goos: linux
            goarch: mips
            gomips: softfloat
            suffix: ""
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: ""
          - goos: linux
            goarch: mips64
            suffix: ""
          - goos: linux
            goarch: mips64le
            suffix: ""
          - goos: linux
            goarch: riscv64
            suffix: ""
          # Windows
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
          - goos: windows
            goarch: "386"
            suffix: ".exe"
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          # FreeBSD
          - goos: freebsd
            goarch: amd64
            suffix: ""
          - goos: freebsd
            goarch: arm64
            suffix: ""
          # OpenBSD
          - goos: openbsd
            goarch: amd64
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          GOMIPS: ${{ matrix.gomips || '' }}
          CGO_ENABLED: "0"
        run: |
          ARMTAG=""
          if [ -n "$GOARM" ]; then ARMTAG="v${GOARM}"; fi
          MIPSTAG=""
          if [ -n "$GOMIPS" ]; then MIPSTAG="-${GOMIPS}"; fi
          OUTNAME="xplex-${GOOS}-${GOARCH}${ARMTAG}${MIPSTAG}${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/${OUTNAME}" ./cmd/xplex
          echo "ASSET_NAME=${OUTNAME}" >> $GITHUB_ENV

      - name: Compress (tar.gz for unix, zip for windows)
        run: |
          cd dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${ASSET_NAME}.zip" "${ASSET_NAME}"
            echo "ARCHIVE=${ASSET_NAME}.zip" >> $GITHUB_ENV
          else
            tar czf "${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
            echo "ARCHIVE=${ASSET_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ARCHIVE }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
